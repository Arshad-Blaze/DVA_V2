[pytest]
testpaths = tests
markers =
    unit: Unit tests (fast, isolated, no I/O)
    integration: Integration tests (multi-layer, contract verification)
    regression: Regression tests (bug fixes, contract stability)
    architecture: Architecture tests (layer isolation, imports, SRP)
    contract: Contract tests (API stability, field access)
    performance: Performance tests (memory, streaming, timing)
    e2e: End-to-end tests (full pipeline scenarios)
    streaming: Tests involving streaming/chunked processing
    large_dataset: Tests with large data volumes
    slow: Tests that take >1s
